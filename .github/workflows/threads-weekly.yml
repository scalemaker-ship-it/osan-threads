name: 오산 스레드 게시 (화·목·토 19시)

# 화·목·토 저녁, 하루 1건.
#   화·토 = 정보성(생활 치아관리 꿀팁)  info_queue.json
#   목    = 일상·소통(오산/동탄/평택/수원 이웃) daily_queue.json
#   날짜 예약글(pinned_posts.json)은 요일 무관하게 그날 우선 발행
#
# GitHub 크론은 실제로 수 시간까지 밀린다(실측: 2026-09-15·17·19 모두 3~4시간 지연 →
# 19시 타겟인데 22~23시에 발행됨). 그래서 '크론 시각'으로 발행을 정하지 않는다.
# KST 15시대~21시대에 15분 간격으로 넓게 깔아두고, post.py 가
# '실제 KST 시각이 19:00~20:30 인가' + '오늘 이미 발행했나'로 판단해 한 번만 발행한다.
# (KST = UTC + 9, 요일 2=화 4=목 6=토)
on:
  schedule:
    - cron: "*/15 6-12 * * 2,4,6"   # KST 15:00~21:45, 15분 간격
    # 날짜 예약글이 화·목·토가 아닌 날이면 그날치 크론을 따로 깔아준다.
    - cron: "*/15 6-12 25 9 *"      # 2026-09-25(금) 추석 당일 인사
  workflow_dispatch:             # 수동 실행 (슬롯 검사 없이 바로 발행)
    inputs:
      dry_run:
        description: "드라이런(글만 출력, Threads 발행 안 함)"
        type: boolean
        default: false
      track:
        description: "트랙 강제 지정 (비우면 오늘 요일로 판단: 화·토=info, 목=daily, pinned=오늘 날짜 예약글)"
        type: choice
        options: ["", "info", "daily", "pinned"]
        default: ""

# 지연으로 여러 실행이 한꺼번에 몰려도 순서대로 하나씩 돌게 한다(중복 발행 방지).
concurrency:
  group: osan-threads-post
  cancel-in-progress: false

permissions:
  contents: write   # 발행 후 큐 소진분 커밋

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TRACK_OVERRIDE: ${{ github.event.inputs.track }}
        run: python post.py

      - name: 소진한 큐 커밋
        if: success()
        run: |
          if git diff --quiet -- info_queue.json daily_queue.json pinned_posts.json posted_log.json; then
            echo "큐 변경 없음 (발행 안 함). 커밋 생략."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add info_queue.json daily_queue.json pinned_posts.json posted_log.json
          git commit -m "큐 1건 소진 (자동 발행)"
          git pull --rebase -q || true
          git push
