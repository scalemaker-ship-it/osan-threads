name: 스레드 성과 수집

# 글별 조회·좋아요·댓글 + 팔로워 도시 분포를 뽑아 리포트로 커밋한다.
# 토큰이 GitHub Secrets 에만 있으므로 수집도 Actions 에서 돈다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST 근처(지연 감안, 시각 민감하지 않음)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 성과 수집
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python insights.py
      - name: 리포트 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights.json insights_report.md
          # 새로 생긴 파일은 git diff 로 안 잡히므로 스테이지 후에 비교한다.
          if git diff --cached --quiet; then
            echo "변경 없음."; exit 0
          fi
          git commit -m "성과 리포트 갱신"
          git pull --rebase -q || true
          git push
